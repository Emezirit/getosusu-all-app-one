<p>Opening OSUSU BY PACKNPAY…</p>
<script>
(function(){
  var c={"ios":"https://apps.apple.com/us/app/osusu-pay-small-small/id6742461026","android":"https://play.google.com/store/apps/details?id=com.osusu.osusu_mobile","windows":"https://www.getosusu.com/","mac":"","fallback":""};
  var ua=navigator.userAgent||"";
  var isMac=/Macintosh|Mac OS X/i.test(ua)||/^Mac/i.test(navigator.platform||"");
  // Safari on iPad reports a Mac by default; touch support tells the two apart.
  var touch=(navigator.maxTouchPoints||0)>1;
  var os="";
  if(/Android/i.test(ua)){os="android";}
  else if(/iPhone|iPad|iPod/i.test(ua)||(isMac&&touch)){os="ios";}
  else if(/Windows/i.test(ua)){os="windows";}
  else if(isMac){os="mac";}
  window.location.replace((os&&c[os])||c.fallback||c.ios||c.android||c.windows||c.mac);
})();
</script>
